authors = [
    { name = "Ganesh9573799445", email = "konganiganesh9@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faker>=40.44.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pytest>=9.2.0",
    "scikit-learn>=1.9.1",
